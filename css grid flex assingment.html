<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Flexbox and Grid</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #333;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between; 
            align-items: center;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
            margin: 0;
            padding: 0;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        .container {
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr; 
            gap: 20px;
        }

        .box {
            background-color: #f4f4f4;
            border: 1px solid #ccc;
            padding: 20px;
            text-align: center;
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px;
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
                gap: 10px;
            }

            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header>
        <div><strong>My Website</strong></div>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <div class="box">
            <h3>Column 1</h3>
            <p>This is the first item in the grid.</p>
        </div>
        <div class="box">
            <h3>Column 2</h3>
            <p>This is the second item in the grid.</p>
        </div>
        <div class="box">
            <h3>Column 3</h3>
            <p>This is the third item in the grid.</p>
        </div>
    </main>

    <footer>
        <p>Footer Content</p>
    </footer>

</body>
</html>

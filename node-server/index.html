<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Node.js Control Center</title>
    <style>
        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --dark: #2d3436;
            --light: #f9f9f9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: var(--dark);
        }

        .card {
            background: white;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 450px;
            width: 90%;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .status-badge {
            display: inline-block;
            padding: 0.5rem 1rem;
            background: #e1f5fe;
            color: #0288d1;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.8rem;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: #1a1a1a;
        }

        p {
            color: #636e72;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            border-top: 1px solid #eee;
            padding-top: 2rem;
        }

        .stat-item {
            text-align: left;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #b2bec3;
            text-transform: uppercase;
        }

        .stat-value {
            font-weight: 600;
            color: var(--dark);
        }

        .pulse {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #00c853;
            border-radius: 50%;
            margin-right: 5px;
            box-shadow: 0 0 0 rgba(0, 200, 83, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 200, 83, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(0, 200, 83, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 200, 83, 0); }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="status-badge">
            <span class="pulse"></span> Server Active
        </div>
        <h1>Node.js Backend</h1>
        <p>This page is being served successfully via the native <code>http</code> and <code>fs</code> modules. Your environment is correctly configured.</p>
        
        <div class="stats">
            <div class="stat-item">
                <div class="stat-label">Host</div>
                <div class="stat-value">Localhost</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Port</div>
                <div class="stat-value">3000</div>
            </div>
        </div>
    </div>

</body>
</html>

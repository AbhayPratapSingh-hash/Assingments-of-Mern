<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic JavaScript Logic</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        input {
            padding: 8px;
            margin: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 8px 15px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #result {
            margin-top: 20px;
            font-weight: bold;
            font-size: 1.2em;
        }
    </style>
</head>
<body>

    <h2>Add Two Numbers</h2>

    <input type="number" id="num1" placeholder="First number">
    <input type="number" id="num2" placeholder="Second number">
    <br>
    <button onclick="checkSum()">Calculate</button>

    <p id="result"></p>

    <script>
        function checkSum() {
            const val1 = document.getElementById('num1').value;
            const val2 = document.getElementById('num2').value;

            const n1 = parseFloat(val1);
            const n2 = parseFloat(val2);

            if (isNaN(n1) || isNaN(n2)) {
                document.getElementById('result').innerText = "Please enter both numbers.";
                return;
            }

            const sum = n1 + n2;
            let type = "";

            if (sum % 2 === 0) {
                type = "Even";
            } else {
                type = "Odd";
            }

            document.getElementById('result').innerText = "Sum: " + sum + " (" + type + ")";
        }
    </script>

</body>
</html>
